spring:
  application:
    name: fundtrack
  # ${NAME:default} → use the environment variable NAME if set, else the default.
  # Defaults = local dev (Docker Postgres on localhost). Deployments (Render) set the real
  # values as env vars, so real credentials never live in this file or in git.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fundtrack}
    username: ${DB_USERNAME:fundtrack}
    password: ${DB_PASSWORD:fundtrack}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080} # hosting platforms (Render) tell the app which port to use via PORT
